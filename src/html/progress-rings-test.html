<!doctype html>
<html lang="en">
  <head>
    <title>Musora Progress Ring Animation POC</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- UI bundle only — this page renders the ring components directly, no player needed. -->
    <script src="<%= uiScript %>"></script>
    <link rel="stylesheet" href="<%= uiStylesheet %>" />

    <style>
      body {
        background: #0c1524;
        color: #fff;
        font-family: sans-serif;
        margin: 0;
        padding: 40px;
      }

      a {
        color: #ffae00;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
      }

      .rings {
        display: flex;
        gap: 80px;
        margin-top: 30px;
      }

      .ring-panel {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .ring-mount {
        background: #111;
        border-radius: 50%;
        padding: 20px;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 260px;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        font-size: 12px;
      }

      .controls input {
        margin-top: 4px;
      }

      button {
        background: #ffae00;
        border: none;
        border-radius: 4px;
        color: #0c1524;
        cursor: pointer;
        font-weight: 600;
        margin-top: 4px;
        padding: 8px 12px;
      }

      button:hover {
        background: #ffc737;
      }

      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .presets button {
        flex: 1 1 auto;
      }
    </style>
  </head>
  <body>
    <h1>Musora End-Screen Progress Ring — Animation POC</h1>
    <p>Standalone harness for iterating on ring visuals/animation before wiring into the real end screen.</p>

    <h2>Rings</h2>
    <div class="rings">
      <div class="ring-panel">
        <h3>Daily (solid)</h3>
        <div class="ring-mount" id="daily-mount"></div>
        <div class="controls">
          <label>From (minutes) <input id="daily-from" type="number" value="10" /></label>
          <label>To (minutes) <input id="daily-to" type="number" value="25" /></label>
          <label>Goal (minutes) <input id="daily-goal" type="number" value="30" /></label>
          <button id="daily-animate">Animate</button>
          <div class="presets">
            <button data-daily-preset="0,15,30">Mid-goal</button>
            <button data-daily-preset="25,30,30">Reach goal</button>
            <button data-daily-preset="20,42,30">Exceed goal</button>
            <button data-daily-preset="0,0,30">Reset</button>
          </div>
        </div>
      </div>

      <div class="ring-panel">
        <h3>Weekly (segmented)</h3>
        <div class="ring-mount" id="weekly-mount"></div>
        <div class="controls">
          <label>Weekly goal (days) <input id="weekly-goal" type="number" value="7" min="1" max="7" /></label>
          <label>Filled days <input id="weekly-filled" type="number" value="3" min="0" max="7" /></label>
          <button id="weekly-animate">Animate</button>
          <div class="presets">
            <button data-weekly-preset="0">Reset</button>
            <button data-weekly-preset="3">3 / goal</button>
            <button data-weekly-preset="7">Goal met</button>
          </div>
        </div>
      </div>

      <div class="ring-panel">
        <h3>Combined weekly → daily reveal sequence</h3>
        <div class="ring-mount" id="combined-mount"></div>
        <div class="controls">
          <label>Weekly from (days) <input id="combined-weekly-from" type="number" value="3" min="0" /></label>
          <label>Weekly to (days) <input id="combined-weekly-to" type="number" value="4" min="0" /></label>
          <label>Weekly goal (days) <input id="combined-weekly-goal" type="number" value="4" min="1" max="7" /></label>
          <label>Daily from (minutes) <input id="combined-daily-from" type="number" value="0" /></label>
          <label>Daily to (minutes) <input id="combined-daily-to" type="number" value="12.5" /></label>
          <label>Daily goal (minutes) <input id="combined-daily-goal" type="number" value="10" /></label>
          <button id="combined-play">Play sequence</button>
        </div>
      </div>
    </div>

    <h2>Award reveal flip</h2>
    <div class="rings">
      <div class="ring-panel">
        <div class="ring-mount" id="award-flip-mount" style="border-radius: 8px; height: 170px; width: 153px"></div>
        <div class="controls">
          <label
            ><input id="award-flip-capable" type="checkbox" checked style="width: auto; margin-top: 0" /> Include
            unearned/back faces (flip-capable)</label
          >
          <label
            >Brand (spark colors)
            <select id="award-flip-brand">
              <option value="">(none — default gold)</option>
              <option value="drumeo">drumeo</option>
              <option value="pianote" selected>pianote</option>
              <option value="guitareo">guitareo</option>
              <option value="singeo">singeo</option>
              <option value="playbass">playbass</option>
            </select></label
          >
          <button id="award-flip-set">Set award (baseline)</button>
          <button id="award-flip-play">Play flip</button>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      var combinedMount = document.getElementById('combined-mount');
      var combinedRings;

      function rebuildCombinedRings(weeklyTotalSegments) {
        if (combinedRings) {
          combinedRings.release();
          combinedMount.innerHTML = '';
        }
        combinedRings = new bitmovin.playerui.MusoraEndScreenProgressRings({
          size: 180,
          strokeWidth: 16,
          weeklyTotalSegments: weeklyTotalSegments,
        });
        combinedMount.appendChild(combinedRings.getDomElement().get(0));
      }

      rebuildCombinedRings(Number(document.getElementById('combined-weekly-goal').value));

      document.getElementById('combined-weekly-goal').addEventListener('change', function () {
        rebuildCombinedRings(Number(document.getElementById('combined-weekly-goal').value) || 1);
      });

      document.getElementById('combined-play').addEventListener('click', function () {
        combinedRings.playSequence({
          weeklyFrom: Number(document.getElementById('combined-weekly-from').value),
          weeklyTo: Number(document.getElementById('combined-weekly-to').value),
          dailyFrom: Number(document.getElementById('combined-daily-from').value) * 60,
          dailyTo: Number(document.getElementById('combined-daily-to').value) * 60,
          dailyGoal: Number(document.getElementById('combined-daily-goal').value) * 60,
        });
      });

      var awardFlip = new bitmovin.playerui.MusoraAwardFlip();
      document.getElementById('award-flip-mount').appendChild(awardFlip.getDomElement().get(0));

      document.getElementById('award-flip-set').addEventListener('click', function () {
        var flipCapable = document.getElementById('award-flip-capable').checked;
        awardFlip.setAward({
          front: AWARD_FACE_FRONT,
          unearned: flipCapable ? AWARD_FACE_UNEARNED : undefined,
          back: flipCapable ? AWARD_FACE_BACK : undefined,
          brand: document.getElementById('award-flip-brand').value || undefined,
        });
      });

      document.getElementById('award-flip-play').addEventListener('click', function () {
        awardFlip.playFlip();
      });

      // Baseline set on load so there's something to see before clicking.
      awardFlip.setAward({
        front: AWARD_FACE_FRONT,
        unearned: AWARD_FACE_UNEARNED,
        back: AWARD_FACE_BACK,
        brand: document.getElementById('award-flip-brand').value || undefined,
      });

      var dailyRing = new bitmovin.playerui.MusoraDailyProgressRing({ size: 180, strokeWidth: 16 });
      document.getElementById('daily-mount').appendChild(dailyRing.getDomElement().get(0));

      // totalSegments is fixed at construction, so changing the weekly goal rebuilds the ring
      // instance from scratch rather than mutating the existing one in place.
      var weeklyRing;
      var weeklyMount = document.getElementById('weekly-mount');

      function rebuildWeeklyRing(totalSegments) {
        if (weeklyRing) {
          weeklyRing.release();
          weeklyMount.innerHTML = '';
        }
        weeklyRing = new bitmovin.playerui.MusoraWeeklyProgressRing({
          size: 180,
          strokeWidth: 16,
          totalSegments: totalSegments,
        });
        weeklyMount.appendChild(weeklyRing.getDomElement().get(0));
      }

      rebuildWeeklyRing(Number(document.getElementById('weekly-goal').value));

      function animateDaily(fromMinutes, toMinutes, goalMinutes) {
        dailyRing.animateProgress(fromMinutes * 60, toMinutes * 60, goalMinutes * 60);
      }

      function animateWeekly(filledDays) {
        weeklyRing.setFilledSegments(filledDays);
      }

      document.getElementById('daily-animate').addEventListener('click', function () {
        animateDaily(
          Number(document.getElementById('daily-from').value),
          Number(document.getElementById('daily-to').value),
          Number(document.getElementById('daily-goal').value),
        );
      });

      document.getElementById('weekly-goal').addEventListener('change', function () {
        var goal = Math.max(1, Number(document.getElementById('weekly-goal').value) || 1);
        document.getElementById('weekly-goal').value = goal;
        document.getElementById('weekly-filled').max = goal;
        rebuildWeeklyRing(goal);
      });

      document.getElementById('weekly-animate').addEventListener('click', function () {
        animateWeekly(Number(document.getElementById('weekly-filled').value));
      });

      document.querySelectorAll('[data-daily-preset]').forEach(function (button) {
        button.addEventListener('click', function () {
          var parts = button.getAttribute('data-daily-preset').split(',').map(Number);
          document.getElementById('daily-from').value = parts[0];
          document.getElementById('daily-to').value = parts[1];
          document.getElementById('daily-goal').value = parts[2];
          animateDaily(parts[0], parts[1], parts[2]);
        });
      });

      document.querySelectorAll('[data-weekly-preset]').forEach(function (button) {
        button.addEventListener('click', function () {
          var requested = Number(button.getAttribute('data-weekly-preset'));
          if (requested === 0) {
            // Exercises MusoraWeeklyProgressRing's own reset(), not just setFilledSegments(0).
            weeklyRing.reset();
            document.getElementById('weekly-filled').value = 0;
            return;
          }
          var goal = Number(document.getElementById('weekly-goal').value);
          // "3" clamps to the goal for small goals; "7" (the old "goal met" shorthand) means
          // "fully filled" regardless of what the goal actually is.
          var filled = requested === 7 ? goal : Math.min(requested, goal);
          document.getElementById('weekly-filled').value = filled;
          animateWeekly(filled);
        });
      });
    </script>
